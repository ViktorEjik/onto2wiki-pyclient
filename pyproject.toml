[project]
name = "onto2wiki"
version = "0.1.0"
authors = [
    {name = "Mogilenetc V.M.", email = "your@email.com"}
]
description = "Ontology to Wiki client"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests",
    "python-dotenv",
    "tqdm",
    "colorama"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    'onto2wiki',
    'onto2wiki.exceptions',
    'onto2wiki.parser',
    'onto2wiki.utils',
    'onto2wiki.cmd_client',
    'onto2wiki.web_client'
]

[tool.flake8]
ignore = ["ANN", "D400"]
max-line-length = 120
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "migrations"
]
per-file-ignores = [
    "onto2wiki/__main__.py: D100",
    "onto2wiki/exceptions/__init__.py: D101 D104",
    "onto2wiki/parser/__init__.py: D301",
    "onto2wiki/utils/__init__.py: D104",
    "onto2wiki/tests/*.py: D B017"
]

[pytest]
testpaths = "onto2wiki/tests"  # Где искать тесты
python_files = "*_test.py"  # Шаблон названий файлов
python_classes = "Test*"  # Шаблон названий классов
python_functions = "test_*"  # Шаблон названий функций
