[tool.flake8]
ignore = ["ANN", "D400"]
max-line-length = 120
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    "migrations"
]
per-file-ignores = [
    "onto2wiki/__main__.py: D100",
    "onto2wiki/exceptions.py: D100 D101",
    "onto2wiki/utils.py: D100",
    "tests/*.py: D B017"
]

[pytest]
testpaths = "tests"  # Где искать тесты
python_files = "*_test.py"  # Шаблон названий файлов
python_classes = "Test*"  # Шаблон названий классов
python_functions = "test_*"  # Шаблон названий функций